name: CI / CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: ~/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('.eslintrc.*', 'package-lock.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Run linter
        run: npm run lint
      - name: Check formatting
        run: npx prettier --check .

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Cache vitest
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vitest
            ~/.cache/npm
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-
      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx vitest run --reporter=verbose --coverage
          else
            npx vitest run --reporter=verbose
          fi
        env:
          CI: true
      - name: Upload coverage (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Enforce coverage thresholds (PR only)
        if: github.event_name == 'pull_request'
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          node -e "process.exit($COVERAGE < 80 ? 1 : 0)"
          if [ $? -ne 0 ]; then
            echo "Coverage ${COVERAGE}% below 80% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets 80% threshold"
      - name: Dependency audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Performance benchmark
        run: |
          echo "=== Performance Benchmark ==="
          timeout 150 node --experimental-strip-types --input-type=module -e "
            import { Game } from './js/game.ts';
            import { generateBoard } from './js/board.ts';
            import { calculateBestMove, setAIDepth } from './js/ai.ts';
            setAIDepth(4);
            const game = new Game();
            game.init(generateBoard());
            game.rpsEnabled = true;
            game.eliminatedFactions.add('nature');
            for (const p of game.pieces) if (p.faction === 'nature') p.alive = false;

            const iterations = 10;
            let totalTime = 0;

            for (let i = 0; i < iterations; i++) {
              const start = performance.now();
              const action = calculateBestMove(game, game.currentFaction);
              const elapsed = performance.now() - start;
              totalTime += elapsed;
              console.log('iter ' + i + ' time ' + elapsed.toFixed(1) + 'ms move? ' + !!action);
            }
            console.log('TOTAL ' + totalTime.toFixed(1) + 'ms');
          "

  # Security scanning with CodeQL
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache vitest
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vitest
            ~/.cache/npm
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          MAIN_JS_SIZE=$(stat -c%s dist/main.js)
          MAIN_JS_GZIP=$(gzip -c dist/main.js | wc -c)
          CORE_JS_SIZE=$(stat -c%s dist/ai.js)
          CORE_JS_GZIP=$(gzip -c dist/ai.js | wc -c)
          WORKER_JS_SIZE=$(stat -c%s dist/ai-worker.js)
          WORKER_JS_GZIP=$(gzip -c dist/ai-worker.js | wc -c)

          echo "main.js: ${MAIN_JS_SIZE} bytes (${MAIN_JS_GZIP} gzipped)"
          echo "ai.js: ${CORE_JS_SIZE} bytes (${CORE_JS_GZIP} gzipped)"
          echo "ai-worker.js: ${WORKER_JS_SIZE} bytes (${WORKER_JS_GZIP} gzipped)"

          # Save for comparison (baseline: main ~19.5KB gzip, ai ~7.8KB gzip, ai-worker ~0.6KB gzip)
          echo "BUNDLE_MAIN_GZIP=${MAIN_JS_GZIP}" >> $GITHUB_ENV
          echo "BUNDLE_CORE_GZIP=${CORE_JS_GZIP}" >> $GITHUB_ENV
          echo "BUNDLE_WORKER_GZIP=${WORKER_JS_GZIP}" >> $GITHUB_ENV

          # Guard against large regressions (thresholds sized for current feature set:
          # Dark Mode / Auto-Battle / Replay / TSPN viewer in main; full AI engine in ai.js)
          node -e "
            const limits = { main: 25000, core: 18000, worker: 2000 };
            const sizes  = { main: ${MAIN_JS_GZIP}, core: ${CORE_JS_GZIP}, worker: ${WORKER_JS_GZIP} };
            let failed = false;
            for (const k of Object.keys(limits)) {
              if (sizes[k] > limits[k]) {
                console.log('::error::' + k + '.js gzipped size (' + sizes[k] + ') exceeds ' + limits[k] + 'B threshold');
                failed = true;
              }
            }
            process.exit(failed ? 1 : 0);
          "

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test-results
        if: always()
        run: |
          if [ -d "test-results" ] && [ "$(ls -A test-results)" ]; then
            echo "Test results directory exists and is not empty, uploading..."
          else
            echo "Test results directory is empty or doesn't exist, skipping upload"
            exit 0
          fi
        shell: bash

      - name: Upload test-results artifact
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read coverage
            let coverageMsg = '';
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const pct = cov.total.lines.pct;
              const status = pct >= 80 ? '✅' : '❌';
              coverageMsg = `${status} **Coverage**: ${pct}% (threshold: 80%)`;
            }

            // Read E2E results
            let e2eMsg = '';
            if (fs.existsSync('test-results/results.json')) {
              const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
              const passed = results.suites?.reduce((sum, s) => sum + (s.specs?.filter(sp => sp.ok).length || 0), 0) || 0;
              const failed = results.suites?.reduce((sum, s) => sum + (s.specs?.filter(sp => !sp.ok).length || 0), 0) || 0;
              const total = passed + failed;
              const status = failed === 0 ? '✅' : '❌';
              e2eMsg = `${status} **E2E Tests**: ${passed}/${total} passed`;
            }

            // Read bundle size from env
            const mainGzip = process.env.BUNDLE_MAIN_GZIP || 'N/A';
            const coreGzip = process.env.BUNDLE_CORE_GZIP || 'N/A';
            const workerGzip = process.env.BUNDLE_WORKER_GZIP || 'N/A';
            const bundleMsg = `📦 **Bundle sizes (gzipped)**: main=${mainGzip}B, ai=${coreGzip}B, ai-worker=${workerGzip}B`;

            const body = `## 📊 CI Summary\n\n${coverageMsg}\n${e2eMsg}\n${bundleMsg}\n\n*Node: 24*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Tournament benchmark (manual/scheduled only)
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache vitest
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vitest
            ~/.cache/npm
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Run tournament
        env:
          GAMES_PER_PAIRING: ${{ github.event.inputs.games || '10' }}
          AI_DEPTH: ${{ github.event.inputs.depth || '3' }}
        run: |
          node tournament.js $GAMES_PER_PAIRING $AI_DEPTH

      - name: Upload tournament results
        uses: actions/upload-artifact@v6
        with:
          name: tournament-results
          path: tournament-results.json
          retention-days: 30

      - name: Comment tournament results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('tournament-results.json', 'utf8'));
            const table = results.results ? Object.entries(results.results).map(([engine, matchups]) => {
              const wins = Object.values(matchups).reduce((sum, m) => sum + m.wins, 0);
              const draws = Object.values(matchups).reduce((sum, m) => sum + m.draws, 0);
              const losses = Object.values(matchups).reduce((sum, m) => sum + m.losses, 0);
              const elo = results.elo[engine] || 'N/A';
              return `| ${engine} | ${elo} | ${wins} | ${draws} | ${losses} |`;
            }).join('\n') : 'No results';

            const body = `## 🏆 Tournament Results\n\n| Engine | Elo | W | D | L |\n|--------|-----|---|---|---|\n${table}\n\n*Depth: ${process.env.AI_DEPTH}, Games/pairing: ${process.env.GAMES_PER_PAIRING}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Release automation
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache vitest
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vitest
            ~/.cache/npm
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-
      - name: Build
        run: npm run build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tournament-results.json

  deploy:
    needs: [typecheck, lint, unit-tests, e2e-tests, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache vitest
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/vitest
            ~/.cache/npm
          key: vitest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Build
        run: npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
