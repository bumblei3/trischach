version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # Major version bumps are ignored: they routinely introduce breaking
    # changes (e.g. the 86-package major-updates group broke typecheck,
    # unit-tests and lint) and need deliberate, per-package handling rather
    # than an automated group PR. Minor/patch updates stay enabled.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    allow:
      - dependency-type: "direct"
        update-type: "version-update:semver-patch"
      - dependency-type: "direct"
        update-type: "version-update:semver-minor"
